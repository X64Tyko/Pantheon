# Pantheon
#
# Unraid Compose Manager URL:
#   https://raw.githubusercontent.com/X64Tyko/Pantheon/master/docker-compose.yml
#
# This is the plain variant: CPU-only transcoding, no Cloudflare Tunnel.
# Five other ready-to-use variants (NVENC, VAAPI, and a +cloudflared version
# of each) are attached to every GitHub Release — see
# https://github.com/X64Tyko/Pantheon/releases/latest. All six are generated
# from this same file (scripts/generate-compose-variants.py) and differ only
# in which lines below are commented out, so switching later is just copying
# the toggled block into your own already-customized file — no need to
# re-point at a different file and lose your volume paths.
#
# Before first run, edit the volume paths below to match your setup:
#   MEDIA_PATH  — your media library root (e.g. /mnt/user/Media on Unraid)
#   FILLER_PATH — where yt-dlp downloads land; set this same path as the
#                 Default Download Path in the Hades Downloads page.
#
# Kairos stores its database and config at whatever host path you mount to
# /data below (default: /mnt/user/appdata/kairos). The paths in this file are
# Unraid-style examples — any absolute host path works on any Docker host
# (e.g. ./data/kairos, /home/you/appdata/kairos).
# On first start, open the Hades UI at http://<host>:8000 and configure
# your settings through it.
#
# Port map:
#   8000 — Hermes (single public endpoint: UI, API, live TV, HDHomeRun)
#   8081 — Kairos direct access (optional; useful for debugging)
#
# Optional: remote/HTTPS access via Cloudflare Tunnel — chromecast sender
# support (and anything else requiring a secure context) needs Hades served
# over HTTPS, which a LAN-only http://<host>:8000 address never satisfies.
# This variant doesn't define the cloudflared service at all (it's commented
# out near the bottom of this file), so nothing extra gets pulled or started
# if you don't need it. To enable it, either uncomment that block or grab the
# docker-compose.cloudflared.yml variant instead — then:
#   1. Cloudflare Zero Trust dashboard → Networks → Tunnels → Create a tunnel
#      → connector type "Docker" → copy the token it gives you.
#   2. In that same wizard, add a Public Hostname: whatever hostname you want
#      (e.g. pantheon.yourdomain.com) → service type HTTP → URL hermes:8000.
#      This is also where the hostname is configured — nothing below is
#      per-install-hardcoded, it only needs the token.
#   3. Put that token in a `.env` file next to this compose file:
#        CLOUDFLARE_TUNNEL_TOKEN=eyJ...
#   4. docker compose up -d (or however you normally start the stack — the
#      Unraid Compose Manager UI works fine here, unlike an earlier version
#      of this file which needed a --profile flag it has no way to pass)
#
#   IMPORTANT: the tunnel only exists while the cloudflared container is
#   actually running. Registering it in the Cloudflare dashboard isn't
#   enough on its own — if CLOUDFLARE_TUNNEL_TOKEN isn't set, or the
#   container is stopped, the hostname will simply fail to connect.
#   Check it with: docker compose ps cloudflared

services:
  kairos:
    image: ghcr.io/x64tyko/kairos:latest
    labels:
      - "net.unraid.docker.icon=https://raw.githubusercontent.com/X64Tyko/Pantheon/master/icons/Kairos_Beta_Icon.png"
    ports:
      - "8081:8080"
    environment:
      - KAIROS_SYNC_THREADS=4
      # - KAIROS_DEBUG=1
      # - KAIROS_DEBUG_EPG=1
    volumes:
      - /mnt/user/appdata/kairos:/data
      - /mnt/user/Media:/media:ro
      - /mnt/user/Media/Filler:/downloads
    restart: unless-stopped

  hephaestus:
    image: ghcr.io/x64tyko/hephaestus:latest
    labels:
      - "net.unraid.docker.icon=https://raw.githubusercontent.com/X64Tyko/Pantheon/master/icons/Hephaestus_Beta_Icon.png"
    environment:
      - KAIROS_URL=http://kairos:8080
      # ── NVIDIA: uncomment these three lines and add `runtime: nvidia` below ──
      # - HEPH_HW_ACCEL=nvidia
      # - NVIDIA_VISIBLE_DEVICES=all
      # - NVIDIA_DRIVER_CAPABILITIES=video,compute,utility
      # ── AMD / Intel VAAPI: uncomment these two lines and add `devices` below ─
      - HEPH_HW_ACCEL=amd
      - HEPH_VAAPI_DEV=/dev/dri/renderD128   # override if your render node differs
    # runtime: nvidia   # NVIDIA — requires NVIDIA Container Toolkit on the host
    volumes:
      - /mnt/user/appdata/kairos:/data
      - /mnt/user/Media:/media:ro
    devices:          # AMD — expose the GPU render node
      - /dev/dri/renderD128:/dev/dri/renderD128
    depends_on:
      - kairos
    restart: unless-stopped

  hades:
    image: ghcr.io/x64tyko/hades:latest
    labels:
      - "net.unraid.docker.icon=https://raw.githubusercontent.com/X64Tyko/Pantheon/master/icons/Hades_Beta_Icon.png"
    restart: unless-stopped

  hermes:
    image: ghcr.io/x64tyko/hermes:latest
    labels:
      - "net.unraid.docker.icon=https://raw.githubusercontent.com/X64Tyko/Pantheon/master/icons/Hermes_Beta_Icon.png"
    ports:
      - "8000:8000"
    environment:
      - KAIROS_URL=http://kairos:8080
      - HEPHAESTUS_URL=http://hephaestus:8082
      - HADES_URL=http://hades:3000
    volumes:
      - /mnt/user/appdata/kairos:/data
    depends_on:
      - kairos
      - hephaestus
      - hades
    restart: unless-stopped

  # Cloudflare Tunnel — see the note near the top of this file. This whole
  # block toggles on/off together; enabling it needs a `.env` file next to
  # this compose file with CLOUDFLARE_TUNNEL_TOKEN=... set.
  #
  # Outbound-only, no inbound port mapping needed; the public hostname and
  # its target (hermes:8000) are configured in the Cloudflare dashboard when
  # the tunnel token is created, not here — this file is the same for every
  # install, only the token differs.
  #
  # Deliberately not gated behind a compose `--profile` flag, since some
  # management UIs (Unraid's Compose Manager included) just run compose
  # directly with no way to pass one — instead, once uncommented, it's safe
  # to leave defined even without a token: the entrypoint below checks for
  # CLOUDFLARE_TUNNEL_TOKEN itself and exits cleanly (0) rather than trying
  # to authenticate with nothing if it's unset, and `restart: on-failure`
  # (not unless-stopped) means that clean exit leaves the container quietly
  # sitting at "Exited (0)" instead of crash-looping forever if you uncomment
  # this without setting a token.
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   environment:
  #     - CLOUDFLARE_TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
  #   entrypoint: ["/bin/sh", "-c"]
  #   command:
  #     - |
  #       if [ -z "$$CLOUDFLARE_TUNNEL_TOKEN" ]; then
  #         echo "cloudflared: CLOUDFLARE_TUNNEL_TOKEN not set in .env — skipping (see the note near the top of docker-compose.yml)"
  #         exit 0
  #       fi
  #       exec cloudflared tunnel run --token "$$CLOUDFLARE_TUNNEL_TOKEN"
  #   depends_on:
  #     - hermes
  #   restart: on-failure

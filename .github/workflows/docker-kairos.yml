name: Kairos CI

on:
  push:
    branches: [master]
    # GitHub ignores `paths` entirely for tag pushes (it only applies to
    # branch pushes), so a `vX.Y.Z` release tag always builds+publishes a
    # versioned image regardless of what changed — this is what lets a
    # user's compose.yml pin to a stable release instead of just `:latest`.
    tags: ["v*.*.*"]
    paths:
      - "kairos/**"
      - "shared/**"
      - "momus/kairos/**"
      - "momus/CMakeLists.txt"
      - ".github/workflows/docker-kairos.yml"
      # Kairos's served theme (GET /api/tv/manifest) is generated from
      # Hades' own CSS — see hades/scripts/generate-tv-tokens.mjs — so a
      # token-affecting change there needs a Kairos rebuild too, not just
      # Hades'.
      - "hades/src/index.css"
      - "hades/scripts/generate-tv-tokens.mjs"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional version tag to also publish (e.g. v0.2.0) — for backfilling a release whose tag push predates a CI fix"
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: x64tyko/kairos

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: sudo apt-get update -qq && sudo apt-get install -y cmake ninja-build g++ libssl-dev

      - name: Cache FetchContent deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: momus-deps-${{ hashFiles('kairos/CMakeLists.txt', 'momus/CMakeLists.txt', 'momus/kairos/CMakeLists.txt') }}
          restore-keys: momus-deps-

      - name: Configure
        run: cmake -B build -G Ninja -S . -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --target momus_kairos -j$(nproc)

      - name: Run tests
        run: ctest --test-dir build -R momus_kairos --output-on-failure

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node (for design-token generation)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # kairos/assets/tv-tokens.json has to exist before the build step runs
      # (the Dockerfile COPYs it in explicitly rather than generating it, to
      # keep that stage dependency-free). A committed copy already ships in
      # the repo (see hades/scripts/generate-tv-tokens.mjs's own comment) —
      # this just guarantees the image always gets a fresh one, not a
      # possibly-stale commit.
      - name: Generate design tokens
        run: node hades/scripts/generate-tv-tokens.mjs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: kairos/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${GITHUB_SHA::7}"
          if [ "${{ github.ref }}" = "refs/heads/master" ]; then
            TAGS="$TAGS ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          fi
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAGS="$TAGS ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}"
          fi
          if [ -n "${{ inputs.release_tag }}" ]; then
            TAGS="$TAGS ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.release_tag }}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Create and push manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(for t in ${{ steps.meta.outputs.tags }}; do printf -- '-t %s ' "$t"; done) \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)
